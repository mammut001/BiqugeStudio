name: One-time reader approximate-floor alignment

"on":
  push:
    branches:
      - improve/reading-time-accuracy
    paths:
      - .github/workflows/one-time-reader-floor.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: improve/reading-time-accuracy
          fetch-depth: 0

      - name: Apply exact two-line patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/maoyankanshu/novel/selfuse/ui/reader/ReaderScreen.kt')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'anchorOffset / charsPerPage.coerceAtLeast(256)':
                  'anchorOffset / charsPerPage.coerceAtLeast(PageIndex.MIN_APPROX_CHARS_PER_PAGE)',
              'val cpp = approxCharsPerPage.coerceAtLeast(256)':
                  'val cpp = approxCharsPerPage.coerceAtLeast(PageIndex.MIN_APPROX_CHARS_PER_PAGE)',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          if 'coerceAtLeast(256)' in text:
              raise SystemExit('ReaderScreen.kt still contains a legacy coerceAtLeast(256) clamp')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate patched tree
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lint :app:assembleDebug --stacktrace --no-daemon

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-reader-floor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/maoyankanshu/novel/selfuse/ui/reader/ReaderScreen.kt .github/workflows/one-time-reader-floor.yml
          git commit -m 'fix(reader): align UI approximate-page minimum'
          git push origin HEAD:improve/reading-time-accuracy
