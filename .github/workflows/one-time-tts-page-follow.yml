name: One-time TTS page-follow patch

"on":
  push:
    branches:
      - fix/tts-cross-page-follow
    paths:
      - .github/workflows/one-time-tts-page-follow.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/tts-cross-page-follow
          fetch-depth: 0

      - name: Apply TTS page-follow patch
        run: python3 -c "import base64; exec(base64.b64decode(''))"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate patched tree
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lint :app:assembleDebug --stacktrace --no-daemon

      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/one-time-tts-page-follow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/java/app/maoyankanshu/novel/selfuse/ui/reader/ReaderTtsController.kt app/src/main/java/app/maoyankanshu/novel/selfuse/ui/reader/ReaderScreen.kt .github/workflows/one-time-tts-page-follow.yml
          git commit -m 'feat(reader): follow TTS across page boundaries'
          git push origin HEAD:fix/tts-cross-page-follow
