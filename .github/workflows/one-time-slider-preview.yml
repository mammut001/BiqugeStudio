name: One-time slider seek patch

"on":
  push:
    branches:
      - fix/slider-preview-commit-on-release
    paths:
      - .github/workflows/one-time-slider-preview.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/slider-preview-commit-on-release
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply focused slider patch
        run: python3 .github/scripts/patch_slider_preview.py

      - name: Check diff
        run: git diff --check

      - name: Validate app
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lint :app:assembleDebug --stacktrace --no-daemon

      - name: Commit validated patch and remove one-time helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/maoyankanshu/novel/selfuse/ui/reader/ReaderScreen.kt
          git rm .github/scripts/patch_slider_preview.py .github/workflows/one-time-slider-preview.yml
          git commit -m "fix(reader): commit slider seek only on release"
          git push origin HEAD:fix/slider-preview-commit-on-release
