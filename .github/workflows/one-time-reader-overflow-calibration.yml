name: One-time reader overflow calibration

"on":
  push:
    branches:
      - improve/reading-time-accuracy
    paths:
      - .github/workflows/one-time-reader-overflow-calibration.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: improve/reading-time-accuracy
          fetch-depth: 0

      - name: Apply pagination calibration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          p = Path('app/src/main/java/app/maoyankanshu/novel/selfuse/ui/reader/PageIndex.kt')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '     * Shared lower bound for all virtual-pagination math.', '     * Absolute lower bound for all virtual-pagination math.', 'minimum comment 1')
          s = replace_once(s, '     * The estimator was lowered from the old 256-char floor to 200 when the last-line clipping', '     * Large fonts and narrow viewports can legitimately fit fewer than the old 200/256 floors.', 'minimum comment 2')
          s = replace_once(s, '     * safeguards were tightened, but several downstream helpers still silently re-clamped to 256.', '     * Virtual paging is O(1), so correctness matters more than forcing an arbitrary page size.', 'minimum comment 3')
          s = replace_once(s, '     * That mismatch forced 256 characters onto layouts whose measured estimate was smaller.', '     * Keep this low enough for large-text accessibility layouts while bounding pathological inputs.', 'minimum comment 4')
          s = replace_once(s, '    const val MIN_APPROX_CHARS_PER_PAGE: Int = 200', '    const val MIN_APPROX_CHARS_PER_PAGE: Int = 64', 'minimum value')
          helper = "    const val APPROX_FILL_FACTOR: Float = 0.64f\n\n    /** One overflow feedback step removes roughly one typical CJK line worth of capacity. */\n    const val APPROX_OVERFLOW_SHRINK_FACTOR: Float = 0.94f\n\n    /** Tighten capacity only after the real Compose page reports vertical overflow. */\n    fun tightenApproxCharsPerPageAfterOverflow(charsPerPage: Int): Int {\n        val current = charsPerPage.coerceAtLeast(MIN_APPROX_CHARS_PER_PAGE)\n        if (current <= MIN_APPROX_CHARS_PER_PAGE) return MIN_APPROX_CHARS_PER_PAGE\n        val tightened = (current * APPROX_OVERFLOW_SHRINK_FACTOR).toInt()\n        return tightened.coerceIn(MIN_APPROX_CHARS_PER_PAGE, current - 1)\n    }\n"
          s = replace_once(s, '    const val APPROX_FILL_FACTOR: Float = 0.64f', helper.rstrip('\n'), 'overflow helper')
          p.write_text(s, encoding='utf-8')

          p = Path('app/src/main/java/app/maoyankanshu/novel/selfuse/ui/reader/ReaderScreen.kt')
          s = p.read_text(encoding='utf-8')
          state_old = '    var approxCharsPerPage by remember(book.id) {\n        mutableIntStateOf(PageIndex.DEFAULT_APPROX_CHARS_PER_PAGE)\n    }\n'
          state_new = state_old + '    // Tighten large-book capacity only when the current real layout proves it overflows.\n    var pendingApproxCalibrationOffset by remember(book.id) { mutableStateOf<Int?>(null) }\n    var lastOverflowCalibrationCapacity by remember(book.id) { mutableIntStateOf(-1) }\n'
          s = replace_once(s, state_old, state_new, 'reader calibration state')
          assign_old = '            approxCharsPerPage = charsPerPage\n            val count = PageIndex.approximatePageCount(text.length, charsPerPage)'
          assign_new = '            approxCharsPerPage = charsPerPage\n            pendingApproxCalibrationOffset = null\n            lastOverflowCalibrationCapacity = -1\n            val count = PageIndex.approximatePageCount(text.length, charsPerPage)'
          s = replace_once(s, assign_old, assign_new, 'fresh estimator reset')
          page_marker = '    // Page turns → progress (0…1000) + chapter + anchor.\n'
          calibration = '    // Preserve the underlying character anchor when overflow feedback changes chars/page.\n    LaunchedEffect(approxCharsPerPage, pendingApproxCalibrationOffset, useApproxPaging, book.text.length) {\n        if (!useApproxPaging) return@LaunchedEffect\n        val offset = pendingApproxCalibrationOffset ?: return@LaunchedEffect\n        val cpp = approxCharsPerPage.coerceAtLeast(PageIndex.MIN_APPROX_CHARS_PER_PAGE)\n        val count = PageIndex.approximatePageCount(book.text.length, cpp)\n        val target = PageIndex.clampPageIndex(offset / cpp, count)\n        anchorOffset = offset.coerceIn(0, book.text.length)\n        if (pagerState.currentPage != target) pagerState.scrollToPage(target)\n        pendingApproxCalibrationOffset = null\n    }\n\n'
          s = replace_once(s, page_marker, calibration + page_marker, 'calibration effect')
          collect_old = '            .collect { (page, starts, cpp) ->\n                if (useApproxPaging) {'
          collect_new = '            .collect { (page, starts, cpp) ->\n                if (pendingApproxCalibrationOffset != null) return@collect\n                if (useApproxPaging) {'
          s = replace_once(s, collect_old, collect_new, 'transient page guard')
          layout_old = '                        var pageTextLayout by remember(pageBody, pageTextStyle) {\n                            mutableStateOf<androidx.compose.ui.text.TextLayoutResult?>(null)\n                        }\n                        val bodyModifier = Modifier'
          layout_new = '                        var pageTextLayout by remember(pageBody, pageTextStyle) {\n                            mutableStateOf<androidx.compose.ui.text.TextLayoutResult?>(null)\n                        }\n                        fun capturePageTextLayout(layout: androidx.compose.ui.text.TextLayoutResult) {\n                            pageTextLayout = layout\n                            if (!useApproxPaging || !restoreApplied || !layout.didOverflowHeight) return\n                            if (page != pagerState.currentPage || bodyPage != pagerState.currentPage) return\n                            val currentCapacity = approxCharsPerPage\n                            if (lastOverflowCalibrationCapacity == currentCapacity) return\n                            val tightened = PageIndex.tightenApproxCharsPerPageAfterOverflow(currentCapacity)\n                            if (tightened >= currentCapacity) return\n                            lastOverflowCalibrationCapacity = currentCapacity\n                            pendingApproxCalibrationOffset = pageStartOffset\n                            approxCharsPerPage = tightened\n                        }\n                        val bodyModifier = Modifier'
          s = replace_once(s, layout_old, layout_new, 'layout overflow callback')
          callback = 'onTextLayout = { pageTextLayout = it },'
          if s.count(callback) != 2:
              raise SystemExit(f'onTextLayout callbacks: expected 2 matches, found {s.count(callback)}')
          s = s.replace(callback, 'onTextLayout = ::capturePageTextLayout,')
          p.write_text(s, encoding='utf-8')

          p = Path('app/src/test/java/app/maoyankanshu/novel/selfuse/ui/reader/PageIndexTest.kt')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, 'assertEquals(listOf(0, 200), PageIndex.approximatePageStartOffsets(257, 1))', 'assertEquals(listOf(0, 64, 128, 192, 256), PageIndex.approximatePageStartOffsets(257, 1))', 'start offsets assertion')
          start = s.index('    @Test\n    fun approximatePaging_honorsEstimatorBelowLegacy256Floor()')
          end = s.index('    @Test\n    fun approximateCharsPerPage_isPositiveAndConservative()', start)
          replacement = '    @Test\n    fun approximatePaging_acceptsRealCapacitiesBelowLegacyFloors() {\n        val min = PageIndex.MIN_APPROX_CHARS_PER_PAGE\n        val text = "甲".repeat(457)\n        assertTrue(min < 200)\n        assertEquals(8, PageIndex.approximatePageCount(text.length, min))\n        assertEquals(min, PageIndex.approximateOffsetForPage(1, min, text.length))\n        assertEquals(3, PageIndex.approximatePageCount(text.length, 180))\n        assertEquals(180, PageIndex.approximateOffsetForPage(1, 180, text.length))\n        assertEquals(8, PageIndex.approximatePageCount(text.length, 1))\n    }\n\n    @Test\n    fun overflowFeedback_tightensMonotonicallyToAbsoluteMinimum() {\n        val first = PageIndex.tightenApproxCharsPerPageAfterOverflow(256)\n        assertTrue(first in PageIndex.MIN_APPROX_CHARS_PER_PAGE until 256)\n        val second = PageIndex.tightenApproxCharsPerPageAfterOverflow(first)\n        assertTrue(second < first)\n        assertEquals(PageIndex.MIN_APPROX_CHARS_PER_PAGE, PageIndex.tightenApproxCharsPerPageAfterOverflow(PageIndex.MIN_APPROX_CHARS_PER_PAGE))\n        assertEquals(PageIndex.MIN_APPROX_CHARS_PER_PAGE, PageIndex.tightenApproxCharsPerPageAfterOverflow(1))\n    }\n\n'
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate patched tree
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lint :app:assembleDebug --stacktrace --no-daemon

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-reader-overflow-calibration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/maoyankanshu/novel/selfuse/ui/reader/PageIndex.kt app/src/main/java/app/maoyankanshu/novel/selfuse/ui/reader/ReaderScreen.kt app/src/test/java/app/maoyankanshu/novel/selfuse/ui/reader/PageIndexTest.kt .github/workflows/one-time-reader-overflow-calibration.yml
          git commit -m 'fix(reader): calibrate large pages from real overflow'
          git push origin HEAD:improve/reading-time-accuracy
