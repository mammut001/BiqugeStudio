# Dependabot: keep Gradle and GitHub Actions deps on a weekly cadence.
# Review and merge PRs like any other change; run unit tests + lint + assembleDebug.
# Scope is this repository only (BiqugeStudio). Does not invent release or CI status.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - gradle

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
